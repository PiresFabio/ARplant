<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.0.4/dist/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

      /* manual camera background */
      #bgVideo {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 1;
        background: #000;
      }

      /* A-Frame on top */
      a-scene { position: fixed !important; inset: 0 !important; z-index: 2 !important; }

      #panel {
        position: fixed; left: 10px; top: 10px; z-index: 2147483647;
        background: rgba(0,0,0,0.85); color:#fff;
        padding: 10px 12px; border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        white-space: pre-wrap;
        pointer-events: none;
        max-width: calc(100vw - 20px);
      }
      #startBtn {
        position: fixed; right: 10px; top: 10px; z-index: 2147483647;
        padding: 10px 12px; border-radius: 10px;
        border: 0; background: rgba(255,255,255,0.92);
        color:#000; font-size: 14px;
      }
    </style>
  </head>

  <body>
    <video id="bgVideo" autoplay playsinline muted></video>
    <div id="panel">BOOTING…</div>
    <button id="startBtn">Tap to start</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true">
      <!-- Pointer rig in camera space -->
      <a-entity id="pointerRig" position="0 1.6 -2">
        <a-box id="pointerBox" depth="0.35" height="0.35" width="0.8" color="yellow"></a-box>
        <a-cone id="pointerTip" position="0 0 -0.6" radius-bottom="0.18" radius-top="0" height="0.35" color="yellow"></a-cone>
      </a-entity>

      <!-- Local ring for reference -->
      <a-ring position="0 1.6 -2.2" radius-inner="0.45" radius-outer="0.47" color="white" opacity="0.5"></a-ring>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const bgVideo = document.getElementById("bgVideo");
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");
      const pointerRig = document.getElementById("pointerRig");

      // ✅ Your fixed target (keep this as your “real” location)
      const TARGET_LAT = 34.840041;
      const TARGET_LON = 134.161985;

      // ✅ Make the “walkable” test target only 3 meters away from your CURRENT position
      // We'll compute a "near target" once we get your first GPS fix.
      const NEAR_DISTANCE_METERS = 3;

      // internal state
      let nearTarget = null; // {lat, lon}
      let deviceHeading = null;

      function show(msg){ panel.textContent = msg; }

      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;

      function distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat/2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * (Math.sin(dLon/2) ** 2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function bearingDeg(lat1, lon1, lat2, lon2) {
        const φ1 = toRad(lat1), φ2 = toRad(lat2);
        const Δλ = toRad(lon2 - lon1);
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        let θ = toDeg(Math.atan2(y, x));
        return (θ + 360) % 360;
      }

      // Create a coordinate NEAR_DISTANCE_METERS to the EAST of current position
      // (east = easier to reason about; you can change to north if you prefer)
      function makeOffsetEast(lat, lon, metersEast) {
        // longitude degrees per meter depends on latitude
        const metersPerDegLon = 111320 * Math.cos(toRad(lat));
        const dLon = metersEast / metersPerDegLon;
        return { lat, lon: lon + dLon };
      }

      function setupDeviceHeading() {
        window.addEventListener("deviceorientationabsolute", (e) => {
          if (typeof e.alpha === "number") deviceHeading = e.alpha;
        }, true);

        window.addEventListener("deviceorientation", (e) => {
          if (deviceHeading == null && typeof e.alpha === "number") deviceHeading = e.alpha;
        }, true);
      }

      async function requestMotionPermissionIfNeeded() {
        try {
          if (typeof DeviceOrientationEvent !== "undefined" &&
              typeof DeviceOrientationEvent.requestPermission === "function") {
            const res = await DeviceOrientationEvent.requestPermission();
            return res === "granted";
          }
        } catch (_) {}
        return true;
      }

      async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        bgVideo.srcObject = stream;
      }

      function updatePointer(meLat, meLon, meAcc) {
        // If we haven't created the "near target" yet, create it from your first fix
        if (!nearTarget) {
          nearTarget = makeOffsetEast(meLat, meLon, NEAR_DISTANCE_METERS);
        }

        // Compare you → NEAR target (3m) so you can walk around it
        const distNear = distanceMeters(meLat, meLon, nearTarget.lat, nearTarget.lon);
        const brgNear  = bearingDeg(meLat, meLon, nearTarget.lat, nearTarget.lon);

        // Also keep showing your REAL fixed target distance (for reference)
        const distReal = distanceMeters(meLat, meLon, TARGET_LAT, TARGET_LON);
        const brgReal  = bearingDeg(meLat, meLon, TARGET_LAT, TARGET_LON);

        let relNear = null;
        if (typeof deviceHeading === "number") {
          relNear = (brgNear - deviceHeading + 360) % 360; // 0 forward
          pointerRig.setAttribute("rotation", `0 ${relNear} 0`);
        } else {
          pointerRig.setAttribute("rotation", "0 0 0");
        }

        show(
          "WALKABLE TARGET (≈3m away)\n" +
          `near lat: ${nearTarget.lat.toFixed(6)}\n` +
          `near lon: ${nearTarget.lon.toFixed(6)}\n` +
          `near distance: ${distNear.toFixed(1)}m\n` +
          `near bearing: ${Math.round(brgNear)}°\n` +
          (relNear == null ? "heading: (not available)\n" : `heading: ${Math.round(deviceHeading)}°  rel: ${Math.round(relNear)}°\n`) +
          "\nYOU\n" +
          `lat: ${meLat.toFixed(6)}\n` +
          `lon: ${meLon.toFixed(6)}\n` +
          `accuracy: ${Math.round(meAcc)}m\n\n` +
          "REAL TARGET (your fixed coords)\n" +
          `real distance: ${Math.round(distReal)}m\n` +
          `real bearing: ${Math.round(brgReal)}°\n\n` +
          "Tip:\n" +
          "- Walk until near distance ~0–3m.\n" +
          "- If rel ~0°, the walkable target is straight ahead.\n"
        );
      }

      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";

        const motionOK = await requestMotionPermissionIfNeeded();
        setupDeviceHeading();

        try {
          await startCamera();
        } catch (e) {
          show("Camera failed: " + (e.message || e));
          return;
        }

        // Start GPS updates
        navigator.geolocation.watchPosition(
          (p) => updatePointer(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
          (e) => show("GPS ERROR: " + e.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      });

      // OPTIONAL: tap anywhere to “reset” the walkable target 3m east of your *current* location
      // This is super useful if you walk far and want a new nearby anchor.
      document.addEventListener("click", (ev) => {
        // ignore the button click (already hidden after start)
        if (!nearTarget) return;
        // We'll reset on any tap after start:
        navigator.geolocation.getCurrentPosition(
          (p) => {
            nearTarget = makeOffsetEast(p.coords.latitude, p.coords.longitude, NEAR_DISTANCE_METERS);
          },
          () => {},
          { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 }
        );
      }, { passive: true });
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin:0; overflow:hidden; background:#000; }
      #panel {
        position: fixed; left: 10px; top: 10px; z-index: 9999;
        background: rgba(0,0,0,0.75); color: #fff;
        padding: 10px 12px; border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: calc(100vw - 20px);
        white-space: pre-wrap;
      }
      #panel b { font-weight: 700; }
      #startBtn {
        position: fixed; right: 10px; top: 10px; z-index: 10000;
        padding: 10px 12px; border-radius: 10px;
        border: 0; background: rgba(255,255,255,0.9); color: #000;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <button id="startBtn">Tap to start</button>
    <div id="panel">loading…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true; logarithmicDepthBuffer:true;"
      arjs="sourceType:webcam; videoTexture:true; facingMode:environment; debugUIEnabled:false; gpsMinDistance:0; gpsTimeInterval:1000;"
    >
      <a-assets>
        <!-- Use an ABSOLUTE path so GitHub Pages subfolder deployments don’t break -->
        <a-asset-item id="model" src="./assets/ice_cream_girl.glb"></a-asset-item>
      </a-assets>

      <!-- Big red box (should show even if GLB fails) -->
      <a-box
        gps-entity-place="latitude: 34.840041; longitude: 134.161985;"
        position="0 1.6 -3"
        depth="2" height="2" width="2"
        color="red"
      ></a-box>

      <!-- Your GLB -->
      <a-entity
        gps-entity-place="latitude: 34.840041; longitude: 134.161985;"
        gltf-model="#model"
        position="0 1.6 -3"
        scale="10 10 10"
      ></a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");

      function line(label, value) { return `${label}: ${value}\n`; }

      // Show errors
      window.addEventListener("error", (e) => {
        panel.textContent = "JS ERROR:\n" + (e.message || "unknown") +
          (e.filename ? `\n${e.filename}:${e.lineno}:${e.colno}` : "");
      });
      window.addEventListener("unhandledrejection", (e) => {
        panel.textContent = "PROMISE REJECTION:\n" + (e.reason ? (e.reason.message || e.reason) : "unknown");
      });

      // Asset load status
      const asset = document.getElementById("model");
      asset.addEventListener("loaded", () => {
        // Note: "loaded" fires when the asset tag loads; the GLB could still be empty, but 404 won't load.
      });

      // GPS + camera status loop
      navigator.geolocation.watchPosition(
        (p) => {
          const { latitude, longitude, accuracy } = p.coords;
          const vid = document.querySelector("video");
          const vidState = vid
            ? `present, readyState=${vid.readyState}, paused=${vid.paused}`
            : "NOT FOUND";

          panel.textContent =
            line("URL", location.href) +
            line("HTTPS", location.protocol) +
            line("GPS lat", latitude.toFixed(6)) +
            line("GPS lon", longitude.toFixed(6)) +
            line("Accuracy", Math.round(accuracy) + "m") +
            line("Video", vidState) +
            line("Model src", asset.getAttribute("src"));
        },
        (e) => {
          panel.textContent = "GEOLOCATION ERROR:\n" + e.message;
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );

      // iOS often needs a user gesture to start camera reliably
      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";
        try {
          await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        } catch (e) {
          // If blocked, you'll still see camera state in the panel (Video: NOT FOUND or paused=true)
        }
      });
    </script>
  </body>
</html>

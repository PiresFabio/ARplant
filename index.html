<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- A-Frame -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.0.4/dist/aframe.min.js" crossorigin="anonymous"></script>

    <!-- AR.js ONLY for gps-camera / gps-entity-place components (we will NOT use its webcam pipeline) -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

      /* Real camera background (we control this, not AR.js) */
      #bgVideo {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 1;
        background: #000;
      }

      /* A-Frame canvas sits on top */
      a-scene {
        position: fixed !important;
        inset: 0 !important;
        z-index: 2 !important;
      }

      #panel {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 2147483647;
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        white-space: pre-wrap;
        pointer-events: none;
        max-width: calc(100vw - 20px);
      }

      #startBtn {
        position: fixed;
        right: 10px;
        top: 10px;
        z-index: 2147483647;
        padding: 10px 12px;
        border-radius: 10px;
        border: 0;
        background: rgba(255,255,255,0.92);
        color: #000;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <!-- Manual camera feed -->
    <video id="bgVideo" autoplay playsinline muted></video>

    <div id="panel">BOOTING…</div>
    <button id="startBtn">Tap to start camera</button>

    <!-- Transparent A-Frame overlay -->
    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true"
    >
      <!-- Control cube (always visible) -->
      <a-box position="0 1.6 -2" depth="0.6" height="0.6" width="0.6" color="yellow"></a-box>

      <!-- Camera entity (just for view) -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");
      const bgVideo = document.getElementById("bgVideo");
      const scene = document.querySelector("a-scene");

      function show(msg) { panel.textContent = msg; }

      window.onerror = function (msg, src, line, col) {
        show("JS ERROR:\n" + msg + "\n" + (src ? `${src}:${line}:${col}` : ""));
      };
      window.addEventListener("unhandledrejection", (e) => {
        show("PROMISE REJECTION:\n" + (e.reason?.message || e.reason || "unknown"));
      });

      let spawned = false;

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
          bgVideo.srcObject = stream;

          show("Camera OK.\nWaiting for GPS fix…");
          return true;
        } catch (e) {
          show("Camera FAILED:\n" + (e.name || "") + "\n" + (e.message || e) +
               "\n\nFix:\n- iPhone Settings → Safari → Camera: Allow\n- Open in Safari (not LINE/Slack browser)");
          return false;
        }
      }

      // Force GPS permission prompt + show exact GPS errors
      function startGPS() {
        navigator.geolocation.watchPosition(
          (p) => {
            const { latitude, longitude, accuracy } = p.coords;

            show(
              "GPS OK\n" +
              "lat: " + latitude.toFixed(6) + "\n" +
              "lon: " + longitude.toFixed(6) + "\n" +
              "accuracy: " + Math.round(accuracy) + "m\n\n" +
              "If pillars spawn, rotate 360° slowly."
            );

            if (spawned) return;
            spawned = true;

            // Spawn 4 pillars around CURRENT position (~20m)
            const dLat = 0.00018;
            const dLon = 0.00022;

            const targets = [
              { la: latitude + dLat, lo: longitude,        c: "red",    name: "N" },
              { la: latitude - dLat, lo: longitude,        c: "green",  name: "S" },
              { la: latitude,        lo: longitude + dLon, c: "blue",   name: "E" },
              { la: latitude,        lo: longitude - dLon, c: "orange", name: "W" },
            ];

            targets.forEach(t => {
              const pillar = document.createElement("a-cylinder");
              pillar.setAttribute("gps-entity-place", { latitude: t.la, longitude: t.lo });
              pillar.setAttribute("position", "0 10 0");
              pillar.setAttribute("radius", "2");
              pillar.setAttribute("height", "20");
              pillar.setAttribute("color", t.c);

              const label = document.createElement("a-text");
              label.setAttribute("value", t.name);
              label.setAttribute("align", "center");
              label.setAttribute("color", "#fff");
              label.setAttribute("position", "0 12 0");
              pillar.appendChild(label);

              scene.appendChild(pillar);
            });
          },
          (e) => {
            show("GPS ERROR:\n" + e.code + " - " + e.message +
                 "\n\nFix:\n- Settings → Privacy & Security → Location Services: ON\n- Safari → Location: Allow\n- Precise Location: ON");
          },
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      }

      show("BOOT OK.\nTap the button to start camera.\n(You already have GPS permission, but we’ll request it anyway.)");

      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";
        const camOK = await startCamera();
        if (camOK) startGPS();
      });
    </script>
  </body>
</html>

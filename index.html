<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- GPS-only AR.js build -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-location-only.js"></script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true;"
      arjs="sourceType: webcam; gpsMinDistance: 0; gpsTimeInterval: 1000;"
    >
      <!-- PURE PRIMITIVE -->
      <a-box
        gps-entity-place="latitude: 34.840041; longitude: 134.161985;"
        position="0 1.6 -3"
        depth="1"
        height="1"
        width="1"
        color="red"
      ></a-box>

      <a-camera gps-camera></a-camera>
    </a-scene>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.0.4/dist/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

      /* manual camera background */
      #bgVideo {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 1;
        background: #000;
      }

      /* A-Frame on top */
      a-scene { position: fixed !important; inset: 0 !important; z-index: 2 !important; }

      #panel {
        position: fixed; left: 10px; top: 10px; z-index: 2147483647;
        background: rgba(0,0,0,0.85); color:#fff;
        padding: 10px 12px; border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        white-space: pre-wrap;
        pointer-events: none;
        max-width: calc(100vw - 20px);
      }
      #startBtn {
        position: fixed; right: 10px; top: 10px; z-index: 2147483647;
        padding: 10px 12px; border-radius: 10px;
        border: 0; background: rgba(255,255,255,0.92);
        color:#000; font-size: 14px;
      }
    </style>
  </head>

  <body>
    <video id="bgVideo" autoplay playsinline muted></video>
    <div id="panel">BOOTING…</div>
    <button id="startBtn">Tap to start</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true">
      <!-- “Pointer” rig attached to camera space -->
      <a-entity id="pointerRig" position="0 1.6 -2">
        <!-- Yellow cube: we’ll rotate this to “point” toward target -->
        <a-box id="pointerBox" depth="0.35" height="0.35" width="0.8" color="yellow"></a-box>

        <!-- A little cone on the front so it looks like an arrow -->
        <a-cone id="pointerTip" position="0 0 -0.6" radius-bottom="0.18" radius-top="0" height="0.35" color="yellow"></a-cone>
      </a-entity>

      <!-- optional: a small horizon line so you see rotation -->
      <a-ring position="0 1.6 -2.2" radius-inner="0.45" radius-outer="0.47" color="white" opacity="0.5"></a-ring>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const bgVideo = document.getElementById("bgVideo");
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");

      const pointerRig = document.getElementById("pointerRig"); // we rotate this
      const pointerBox = document.getElementById("pointerBox");

      // ✅ Set your target coordinate here
      const TARGET_LAT = 34.840041;
      const TARGET_LON = 134.161985;

      function show(msg){ panel.textContent = msg; }

      window.onerror = function (msg, src, line, col) {
        show("JS ERROR:\n" + msg + "\n" + (src ? `${src}:${line}:${col}` : ""));
      };

      // ----- math helpers -----
      const toRad = d => d * Math.PI / 180;
      const toDeg = r => r * 180 / Math.PI;

      function distanceMeters(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const dLat = toRad(lat2 - lat1);
        const dLon = toRad(lon2 - lon1);
        const a =
          Math.sin(dLat/2) ** 2 +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * (Math.sin(dLon/2) ** 2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      // bearing from point1 to point2 (0°=North, 90°=East)
      function bearingDeg(lat1, lon1, lat2, lon2) {
        const φ1 = toRad(lat1), φ2 = toRad(lat2);
        const Δλ = toRad(lon2 - lon1);
        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        let θ = toDeg(Math.atan2(y, x)); // -180..180
        θ = (θ + 360) % 360;            // 0..360
        return θ;
      }

      // Try to read device heading.
      // On iOS, Geolocation heading is often null; we try DeviceOrientationEvent.
      let deviceHeading = null; // degrees, 0..360 (0=N)
      function setupDeviceHeading() {
        window.addEventListener("deviceorientationabsolute", (e) => {
          if (typeof e.alpha === "number") {
            // alpha is 0..360, but depends on implementation; treat as compass heading-ish
            deviceHeading = e.alpha;
          }
        }, true);

        window.addEventListener("deviceorientation", (e) => {
          if (deviceHeading == null && typeof e.alpha === "number") {
            deviceHeading = e.alpha;
          }
        }, true);
      }

      async function requestMotionPermissionIfNeeded() {
        try {
          if (typeof DeviceOrientationEvent !== "undefined" &&
              typeof DeviceOrientationEvent.requestPermission === "function") {
            const res = await DeviceOrientationEvent.requestPermission();
            return res === "granted";
          }
        } catch (_) {}
        return true;
      }

      async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        bgVideo.srcObject = stream;
      }

      function updatePointer(lat, lon, acc) {
        const dist = distanceMeters(lat, lon, TARGET_LAT, TARGET_LON);
        const brg = bearingDeg(lat, lon, TARGET_LAT, TARGET_LON); // 0=N

        // If we have deviceHeading, we can point relative to where you're facing:
        // relative = bearing - heading
        let rel = null;
        if (typeof deviceHeading === "number") {
          rel = (brg - deviceHeading + 360) % 360; // 0=forward, 90=right
          // rotate the pointer rig around Y (A-Frame uses Y up; yaw rotation)
          pointerRig.setAttribute("rotation", `0 ${rel} 0`);
        } else {
          // No heading: still show numbers; keep pointer fixed
          pointerRig.setAttribute("rotation", "0 0 0");
        }

        // make pointer bigger when far, smaller when close (visual cue)
        const s = Math.min(2.5, Math.max(0.7, dist / 20));
        pointerRig.setAttribute("scale", `${s} ${s} ${s}`);

        show(
          "TARGET\n" +
          `lat: ${TARGET_LAT}\nlon: ${TARGET_LON}\n\n` +
          "YOU\n" +
          `lat: ${lat.toFixed(6)}\nlon: ${lon.toFixed(6)}\naccuracy: ${Math.round(acc)}m\n\n` +
          `distance: ${Math.round(dist)}m\n` +
          `bearing (N=0,E=90): ${Math.round(brg)}°\n` +
          (rel == null
            ? "heading: (not available) → enable Motion & Orientation\n"
            : `heading: ${Math.round(deviceHeading)}°\nrelative: ${Math.round(rel)}° (0=forward, 90=right)\n`) +
          "\nHow to use:\n" +
          "- If relative is ~0°, target is straight ahead.\n" +
          "- If ~90°, target is to your RIGHT.\n" +
          "- If ~270°, target is to your LEFT.\n"
        );
      }

      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";

        const motionOK = await requestMotionPermissionIfNeeded();
        if (!motionOK) show("Motion permission denied. Pointer can’t aim. Enable it in Settings.");

        setupDeviceHeading();

        try {
          await startCamera();
        } catch (e) {
          show("Camera failed: " + (e.message || e));
          return;
        }

        // Force GPS permission prompt and update pointer continuously
        navigator.geolocation.watchPosition(
          (p) => updatePointer(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
          (e) => show("GPS ERROR: " + e.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
        );
      });
    </script>
  </body>
</html>

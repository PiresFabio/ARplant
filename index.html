<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>

    <!-- LOCATION-ONLY GPS BUILD (correct for gps-new-*) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-location-only.js"></script>

    <style>
      #debug {
        position: fixed;
        bottom: 10px;
        left: 10px;
        z-index: 9999;
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>

  <body style="margin:0; overflow:hidden;">
    <div id="debug">waiting for GPS…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="logarithmicDepthBuffer:true"
    >
      <!-- GUARANTEED VISIBLE OBJECT -->
      <a-box
        gps-new-entity-place="latitude: 34.840041; longitude: 134.161985;"
        position="0 1.6 -3"
        depth="2"
        height="2"
        width="2"
        color="red"
      ></a-box>

      <a-camera gps-new-camera></a-camera>
    </a-scene>

    <script>
      const debug = document.getElementById("debug");

      navigator.geolocation.watchPosition(
        p => {
          const { latitude, longitude, accuracy } = p.coords;
          debug.textContent =
            "lat: " + latitude.toFixed(6) + "\n" +
            "lon: " + longitude.toFixed(6) + "\n" +
            "accuracy: " + Math.round(accuracy) + "m";
        },
        e => debug.textContent = e.message,
        { enableHighAccuracy: true }
      );
    </script>
  </body>
</html>

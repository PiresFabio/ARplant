<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.0.4/dist/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }

      /* manual camera background */
      #bgVideo {
        position: fixed; inset: 0;
        width: 100vw; height: 100vh;
        object-fit: cover;
        z-index: 1;
        background: #000;
      }

      /* A-Frame on top */
      a-scene { position: fixed !important; inset: 0 !important; z-index: 2 !important; }

      #panel {
        position: fixed; left: 10px; top: 10px; z-index: 2147483647;
        background: rgba(0,0,0,0.85); color:#fff;
        padding: 10px 12px; border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        white-space: pre-wrap;
        pointer-events: none;
        max-width: calc(100vw - 20px);
      }
      #startBtn {
        position: fixed; right: 10px; top: 10px; z-index: 2147483647;
        padding: 10px 12px; border-radius: 10px;
        border: 0; background: rgba(255,255,255,0.92);
        color:#000; font-size: 14px;
      }
    </style>

    <script>
      // Auto-center + auto-scale any glTF so it's visible even if tiny / pivot is far away.
      AFRAME.registerComponent('autoscale-center', {
        schema: { targetSizeMeters: { type: 'number', default: 1.6 } }, // make largest dimension ~1.6m
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const maxDim = Math.max(size.x, size.y, size.z);
            if (!isFinite(maxDim) || maxDim === 0) return;

            // center mesh at origin
            obj.position.sub(center);

            // scale to target size
            const s = this.data.targetSizeMeters / maxDim;
            this.el.object3D.scale.setScalar(s);

            // ensure visibility
            obj.traverse(n => {
              if (n.isMesh && n.material) {
                n.material.side = THREE.DoubleSide;
                n.material.transparent = false;
                n.material.opacity = 1;
                n.material.needsUpdate = true;
              }
            });
          });
        }
      });
    </script>
  </head>

  <body>
    <video id="bgVideo" autoplay playsinline muted></video>
    <div id="panel">BOOTING…</div>
    <button id="startBtn">Tap to start</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true">
      <a-assets>
        <!-- ✅ Put your GLB here (path must be correct on GitHub Pages) -->
        <a-asset-item id="myModel" src="./assets/ice_cream_girl.glb"></a-asset-item>
      </a-assets>

      <!-- Replace the yellow cube with YOUR GLB in camera space -->
      <a-entity id="pointerRig" position="0 1.4 -2">
        <!-- Your GLB should appear 2m in front of you -->
        <a-entity
          id="testModel"
          gltf-model="#myModel"
          autoscale-center="targetSizeMeters: 1.6"
          rotation="0 180 0"
        ></a-entity>

        <!-- Small helper ring so you know where "front" is -->
        <a-ring position="0 0 -0.2" radius-inner="0.65" radius-outer="0.67" color="white" opacity="0.55"></a-ring>
      </a-entity>

      <!-- Keep camera + GPS so your overlay can still run if needed -->
      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const bgVideo = document.getElementById("bgVideo");
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");

      function show(msg){ panel.textContent = msg; }

      window.onerror = function (msg, src, line, col) {
        show("JS ERROR:\n" + msg + "\n" + (src ? `${src}:${line}:${col}` : ""));
      };

      async function requestMotionPermissionIfNeeded() {
        try {
          if (typeof DeviceOrientationEvent !== "undefined" &&
              typeof DeviceOrientationEvent.requestPermission === "function") {
            const res = await DeviceOrientationEvent.requestPermission();
            return res === "granted";
          }
        } catch (_) {}
        return true;
      }

      async function startCamera() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        bgVideo.srcObject = stream;
      }

      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";

        await requestMotionPermissionIfNeeded();

        try {
          await startCamera();
        } catch (e) {
          show("Camera failed:\n" + (e.message || e));
          return;
        }

        show(
          "Camera OK.\n" +
          "Your GLB should be 2m in front of you.\n\n" +
          "If you DON'T see it:\n" +
          "- the path is wrong OR\n" +
          "- the GLB has no visible mesh/materials."
        );
      });

      // Report model load status in panel
      const testModel = document.getElementById("testModel");
      testModel.addEventListener("model-loaded", () => {
        show("MODEL LOADED ✅\nIf you still can’t see it, it’s likely tiny / pivot / materials.\n(autoscale-center should fix tiny/pivot).");
      });
      testModel.addEventListener("model-error", (e) => {
        show("MODEL ERROR ❌\nCould not load GLB.\nCheck path:\n./assets/ice_cream_girl.glb\n\n" + (e?.detail?.src || ""));
      });
    </script>
  </body>
</html>

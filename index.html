<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- Proven stable versions for iOS -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin:0; overflow:hidden; background:#000; }
      #panel {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 9999;
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font: 12px/1.35 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        white-space: pre-wrap;
      }
      #startBtn {
        position: fixed;
        right: 10px;
        top: 10px;
        z-index: 10000;
        padding: 10px 12px;
        border-radius: 10px;
        border: 0;
        background: rgba(255,255,255,0.92);
        color: #000;
        font-size: 14px;
      }
    </style>
  </head>

  <body>
    <button id="startBtn">Tap to start</button>
    <div id="panel">waiting…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true"
      arjs="sourceType: webcam; videoTexture:true; facingMode:environment; debugUIEnabled:false;"
    >
      <!-- CONTROL: must always show -->
      <a-box position="0 1.6 -2" depth="0.6" height="0.6" width="0.6" color="yellow"></a-box>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");
      const scene = document.querySelector("a-scene");

      function status(text){ panel.textContent = text; }

      startBtn.addEventListener("click", async () => {
        startBtn.style.display = "none";
        try {
          await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio:false });
        } catch (_) {}
      });

      let spawned = false;

      window.addEventListener("load", () => {
        const cam = document.querySelector("[gps-camera]");
        if (!cam) return status("gps-camera not found");

        cam.addEventListener("gps-camera-update-position", (e) => {
          const lat = e.detail.position.latitude;
          const lon = e.detail.position.longitude;

          status(
            "GPS FIX OK\n" +
            "lat: " + lat.toFixed(6) + "\n" +
            "lon: " + lon.toFixed(6) + "\n\n" +
            "Spawning 4 huge pillars ~20m away.\nRotate slowly 360°."
          );

          if (spawned) return;
          spawned = true;

          // ~20m offsets
          const dLat = 0.00018;
          const dLon = 0.00022;

          const targets = [
            { la: lat + dLat, lo: lon,         c: "red",   name: "N" },
            { la: lat - dLat, lo: lon,         c: "green", name: "S" },
            { la: lat,        lo: lon + dLon,  c: "blue",  name: "E" },
            { la: lat,        lo: lon - dLon,  c: "orange",name: "W" },
          ];

          targets.forEach(t => {
            const pillar = document.createElement("a-cylinder");
            pillar.setAttribute("gps-entity-place", {
              latitude: t.la,
              longitude: t.lo
            });
            pillar.setAttribute("position", "0 10 0");
            pillar.setAttribute("radius", "2");
            pillar.setAttribute("height", "20");
            pillar.setAttribute("color", t.c);

            const label = document.createElement("a-text");
            label.setAttribute("value", t.name);
            label.setAttribute("align", "center");
            label.setAttribute("color", "#fff");
            label.setAttribute("position", "0 12 0");
            pillar.appendChild(label);

            scene.appendChild(pillar);
          });
        });
      });
    </script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.0.4/dist/aframe.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.3.2/aframe/build/aframe-ar.js" crossorigin="anonymous"></script>

    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
      #bgVideo { position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 1; }
      a-scene { position: fixed !important; inset: 0 !important; z-index: 2 !important; }

      #panel {
        position: fixed; left: 10px; top: 10px; z-index: 999999;
        background: rgba(0,0,0,0.8); color: #fff;
        padding: 10px 12px; border-radius: 10px;
        font: 12px/1.4 system-ui, sans-serif;
        white-space: pre-wrap;
      }
      #startBtn {
        position: fixed; right: 10px; top: 10px; z-index: 999999;
        padding: 10px 14px; border: 0; border-radius: 10px;
        background: #fff; font-size: 14px;
      }
    </style>

    <script>
      // Auto center + scale GLB to a target physical size (meters-ish)
      AFRAME.registerComponent('autoscale-center', {
        schema: { size: { type: 'number', default: 6.0 } }, // ✅ bigger default
        init: function () {
          this.el.addEventListener('model-loaded', () => {
            const obj = this.el.getObject3D('mesh');
            if (!obj) return;

            const box = new THREE.Box3().setFromObject(obj);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            const max = Math.max(size.x, size.y, size.z);
            if (!isFinite(max) || max === 0) return;

            obj.position.sub(center);

            const s = this.data.size / max;
            this.el.object3D.scale.setScalar(s);
          });
        }
      });
    </script>
  </head>

  <body>
    <video id="bgVideo" autoplay playsinline muted></video>
    <div id="panel">Ready</div>
    <button id="startBtn">Start</button>

    <a-scene embedded vr-mode-ui="enabled:false" renderer="alpha:true; antialias:true">
      <a-assets>
        <a-asset-item id="model" src="./assets/ice_cream_girl.glb"></a-asset-item>
      </a-assets>

      <!-- 🌍 REAL GPS ANCHOR -->
      <a-entity gps-entity-place="latitude: 34.840164; longitude: 134.162219;">

        <!-- ✅ SUPER TALL “lighthouse” pillar -->
        <!-- height 40m, center at y=20 so base touches ground -->
        <a-cylinder
          position="0 20 0"
          radius="2.0"
          height="40"
          color="lime"
          opacity="0.95"
        ></a-cylinder>

        <!-- ✅ Bigger ground ring -->
        <a-ring
          position="0 0.05 0"
          rotation="-90 0 0"
          radius-inner="6"
          radius-outer="6.5"
          color="lime"
          opacity="0.85"
        ></a-ring>

        <!-- ✅ Your GLB: much bigger -->
        <a-entity
          gltf-model="#model"
          autoscale-center="size: 6.0"
          scale="2 2 2"
          position="0 0 0"
          rotation="0 180 0"
        ></a-entity>

      </a-entity>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const bgVideo = document.getElementById("bgVideo");
      const panel = document.getElementById("panel");
      const startBtn = document.getElementById("startBtn");

      async function start() {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        bgVideo.srcObject = stream;

        navigator.geolocation.watchPosition(
          (p) => {
            panel.textContent =
              "GPS OK\n" +
              "accuracy: " + Math.round(p.coords.accuracy) + "m\n\n" +
              "Object location:\n34.840164, 134.162219\n\n" +
              "Tip:\n" +
              "- Walk 10–30m away and look back.\n" +
              "- Rotate slowly 360°.\n" +
              "- With 6m accuracy, it may appear offset.";
          },
          (e) => panel.textContent = "GPS ERROR: " + e.message,
          { enableHighAccuracy: true }
        );
      }

      startBtn.addEventListener("click", () => {
        startBtn.style.display = "none";
        start();
      });
    </script>
  </body>
</html>

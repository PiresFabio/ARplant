<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin:0; overflow:hidden; background:#000; }
      #panel {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 9999;
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="panel">waiting for GPS…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true; logarithmicDepthBuffer:true;"
      arjs="sourceType:webcam; videoTexture:true; facingMode:environment; debugUIEnabled:false; gpsMinDistance:0; gpsTimeInterval:1000;"
    >
      <!-- GUARANTEED visible red cube -->
      <a-box
        gps-entity-place="latitude: 34.840041; longitude: 134.161985;"
        position="0 1.6 -3"
        depth="2"
        height="2"
        width="2"
        color="red"
      ></a-box>

      <a-camera gps-camera></a-camera>
    </a-scene>

    <script>
      const panel = document.getElementById("panel");

      navigator.geolocation.watchPosition(
        (p) => {
          const { latitude, longitude, accuracy } = p.coords;
          panel.textContent =
            "lat: " + latitude.toFixed(6) + "\n" +
            "lon: " + longitude.toFixed(6) + "\n" +
            "accuracy: " + Math.round(accuracy) + "m";
        },
        (e) => {
          panel.textContent = "GPS ERROR:\n" + e.message;
        },
        { enableHighAccuracy: true }
      );
    </script>
  </body>
</html>

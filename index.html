<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

        <!-- IMPORTANT: location helper + aframe ar.js (docs/examples use this combo) -->
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>

        <style>
            #debug {
                position: fixed;
                left: 10px;
                bottom: 10px;
                z-index: 9999;
                background: rgba(0,0,0,0.75);
                color: #fff;
                padding: 10px 12px;
                border-radius: 10px;
                font-size: 12px;
                line-height: 1.4;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
                max-width: calc(100vw - 20px);
                white-space: pre-wrap;
            }
            #hint {
                position: fixed;
                left: 10px;
                top: 10px;
                z-index: 9999;
                background: rgba(0,0,0,0.6);
                color: #fff;
                padding: 8px 10px;
                border-radius: 10px;
                font-size: 12px;
                line-height: 1.3;
                font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            }
        </style>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <div id="hint">If you see this but no camera: likely HTTPS / permissions / in-app browser.</div>
        <div id="debug">debug: loading…</div>

        <a-scene
            renderer="logarithmicDepthBuffer: true;"
            embedded
            vr-mode-ui="enabled: false"
            loading-screen="enabled: false;"
            arjs="sourceType: webcam; debugUIEnabled: false; gpsMinDistance: 0; gpsTimeInterval: 1000;"
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/ice_cream_girl.glb"
                ></a-asset-item>
            </a-assets>

            <!-- ✅ Use the NEW components (more reliable) -->
            <a-entity gps-new-entity-place="latitude: 34.840041; longitude: 134.161985;">
                <!-- BIG red box: should be impossible to miss if rendering works -->
                <a-box position="0 1.6 -3" depth="2" height="2" width="2" color="red"></a-box>

                <!-- Your model too -->
                <a-entity
                    gltf-model="#animated-asset"
                    animation-mixer="loop: repeat"
                    position="0 1.6 -3"
                    scale="10 10 10"
                ></a-entity>
            </a-entity>

            <a-camera gps-new-camera rotation-reader></a-camera>
        </a-scene>

        <script>
            const debug = document.getElementById("debug");

            // Show JS errors on-screen (white screen = often a silent JS error on mobile)
            window.addEventListener("error", (e) => {
                debug.textContent =
                    "JS ERROR:\n" +
                    (e.message || "unknown") +
                    (e.filename ? ("\n" + e.filename + ":" + e.lineno + ":" + e.colno) : "");
            });

            window.addEventListener("unhandledrejection", (e) => {
                debug.textContent = "PROMISE REJECTION:\n" + (e.reason ? (e.reason.message || e.reason) : "unknown");
            });

            // GPS overlay: proves device location is updating
            const TARGET_LAT = 34.840041;
            const TARGET_LON = 134.161985;

            function dist(a,b,c,d){
                const R = 6371000;
                const toRad = x => x * Math.PI / 180;
                const dLat = toRad(c - a);
                const dLon = toRad(d - b);
                const s =
                    Math.sin(dLat/2)**2 +
                    Math.cos(toRad(a)) * Math.cos(toRad(c)) *
                    Math.sin(dLon/2)**2;
                return 2 * R * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s));
            }

            navigator.geolocation.watchPosition(
                (p) => {
                    const { latitude, longitude, accuracy } = p.coords;
                    const d = dist(latitude, longitude, TARGET_LAT, TARGET_LON);

                    debug.textContent =
                        "lat: " + latitude.toFixed(6) + "\n" +
                        "lon: " + longitude.toFixed(6) + "\n" +
                        "accuracy: " + Math.round(accuracy) + "m\n" +
                        "distance: " + Math.round(d) + "m";
                },
                (e) => {
                    debug.textContent = "GEOLOCATION ERROR:\n" + e.message;
                },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
            );
        </script>
    </body>
</html>

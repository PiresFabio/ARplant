<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <!-- A-Frame (pinned version, Safari safe) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe.min.js"
            crossorigin="anonymous"></script>

    <!-- AR.js (pinned, matching build) -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"
            crossorigin="anonymous"></script>

    <style>
      body { margin:0; overflow:hidden; background:#000; }
      #panel {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 9999;
        background: rgba(0,0,0,0.75);
        color: #fff;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 12px;
        font-family: system-ui, sans-serif;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="panel">loading…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="alpha:true; antialias:true"
      arjs="sourceType: webcam; videoTexture:true; facingMode:environment; debugUIEnabled:false; gpsMinDistance:0; gpsTimeInterval:1000;"
    >
      <!-- CONTROL BOX: must ALWAYS show -->
      <a-box
        position="0 1.6 -2"
        depth="0.6" height="0.6" width="0.6"
        color="yellow"
      ></a-box>

      <!-- GPS BOX -->
      <a-box
        gps-entity-place="latitude: 34.840041; longitude: 134.161985;"
        position="0 1.6 -3"
        depth="2" height="2" width="2"
        color="red"
      ></a-box>

      <a-camera gps-camera rotation-reader></a-camera>
    </a-scene>

    <script>
      const panel = document.getElementById("panel");

      window.onerror = function (msg, src, line, col) {
        panel.textContent =
          "JS ERROR:\n" + msg + "\n" +
          (src ? src + ":" + line + ":" + col : "");
      };

      navigator.geolocation.watchPosition(
        (p) => {
          const { latitude, longitude, accuracy } = p.coords;
          const vid = document.querySelector("video");
          panel.textContent =
            "lat: " + latitude.toFixed(6) + "\n" +
            "lon: " + longitude.toFixed(6) + "\n" +
            "accuracy: " + Math.round(accuracy) + "m\n" +
            "video: " + (vid ? "OK" : "NOT FOUND");
        },
        (e) => {
          panel.textContent = "GPS ERROR:\n" + e.message;
        },
        { enableHighAccuracy: true }
      );
    </script>
  </body>
</html>
